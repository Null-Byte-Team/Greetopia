# fly.toml — Greetopia backend (FastAPI / Uvicorn)
# Modern Fly.io v2 Machines format — uses [http_service] instead of [[services]]
# Sits at the repo root alongside vercel.json.
# Deploy: fly deploy  (from repo root)

app            = "greetopia"
primary_region = "ams"
kill_signal    = "SIGINT"
kill_timeout   = "10s"

[build]
  dockerfile = "Dockerfile.flyio"

# Persistent volume — SQLite DB + photos survive deploys and restarts.
# Create once with: fly volumes create greetopia_data --size 1 --region ams
[mounts]
  source      = "greetopia_data"
  destination = "/app/storage"

[env]
  PORT          = "8080"
  DATABASE_PATH = "/app/storage/smart_irrigation.db"
  PHOTO_DIR     = "/app/storage/photos"
  MQTT_ENABLED  = "false"
  LOG_LEVEL     = "info"

# Modern http_service block — Fly handles TLS + IP allocation automatically.
[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 50
    soft_limit = 35

  [[http_service.checks]]
    grace_period = "25s"
    interval     = "30s"
    method       = "GET"
    path         = "/api/v1/health"
    timeout      = "8s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
